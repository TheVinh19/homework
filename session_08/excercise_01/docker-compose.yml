services:
  github-runner:
    image: myoung34/github-runner:ubuntu-noble
    container_name: quickbite-github-runner
    restart: unless-stopped
    environment:
      REPO_URL: "${REPO_URL:?Set REPO_URL in .env}"
      ACCESS_TOKEN: "${ACCESS_TOKEN:?Set a runner-management PAT in .env}"
      RUNNER_SCOPE: repo
      RUNNER_NAME: quickbite-linux-runner
      LABELS: quickbite,docker
      RUNNER_WORKDIR: /opt/quickbite-runner/work
      RUN_AS_ROOT: "false"
      DOCKER_HOST: unix:///var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?Set the host Docker socket group ID in .env}"
    volumes:
      # Share the host daemon socket; fail if the socket is absent.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      # Same absolute path on host and runner for container actions.
      - type: bind
        source: /opt/quickbite-runner/work
        target: /opt/quickbite-runner/work
