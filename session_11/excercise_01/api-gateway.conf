 1. Khối server lắng nghe cổng 80 (HTTP) để tự động chuyển hướng sang HTTPS
server {
    listen 80;
    server_name thevinh19.duckdns.org;

    # Chuyển hướng mọi request HTTP sang HTTPS (Mã 301 - Vĩnh viễn)
    return 301 https://$host$request_uri;
}

# 2. Khối server chính lắng nghe cổng 443 (HTTPS) và điều phối về cổng 8080
server {
    listen 443 ssl; # Cổng HTTPS bảo mật
    server_name thevinh19.duckdns.org;

    # Nhật ký log của server
    access_log /var/log/nginx/api-gateway-access.log;
    error_log /var/log/nginx/api-gateway-error.log;

    # --- CẤU HÌNH SSL ĐƯỢC TỰ ĐỘNG THÊM BỞI CERTBOT ---
    ssl_certificate /etc/letsencrypt/live/thevinh19.duckdns.org/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/thevinh19.duckdns.org/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
    # --------------------------------------------------

    location / {
        # Điều phối request tới cổng 8080 của server
        proxy_pass http://127.0.0.1:8080;

        # Giữ nguyên các thông tin header của client gửi lên
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình giới hạn upload và thời gian chờ
        client_max_body_size 20M;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    } 
}
