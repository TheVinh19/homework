services:
  quickbite-user:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: quickbite-user-service:latest
    container_name: quickbite-user
    ports:
      - "${USER_SERVER_PORT}:${USER_SERVER_PORT}"
    environment:
      - SERVER_PORT=${USER_SERVER_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${USER_DB_NAME}
      - DB_USER=${USER_DB_USERNAME}
      - DB_PASSWORD=${USER_DB_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST}:${DB_PORT}/${USER_DB_NAME}?createDatabaseIfNotExist=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${USER_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${USER_DB_PASSWORD}
    networks:
      - quickbite-net
    restart: unless-stopped

  quickbite-restaurant:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    image: quickbite-restaurant-service:latest
    container_name: quickbite-restaurant
    ports:
      - "${RESTAURANT_SERVER_PORT}:${RESTAURANT_SERVER_PORT}"
    environment:
      - SERVER_PORT=${RESTAURANT_SERVER_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${RESTAURANT_DB_NAME}
      - DB_USER=${RESTAURANT_DB_USERNAME}
      - DB_PASSWORD=${RESTAURANT_DB_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST}:${DB_PORT}/${RESTAURANT_DB_NAME}?createDatabaseIfNotExist=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${RESTAURANT_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RESTAURANT_DB_PASSWORD}
    networks:
      - quickbite-net
    restart: unless-stopped

  quickbite-order:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: quickbite-order-service:latest
    container_name: quickbite-order
    ports:
      - "${ORDER_SERVER_PORT}:${ORDER_SERVER_PORT}"
    environment:
      - SERVER_PORT=${ORDER_SERVER_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${ORDER_DB_NAME}
      - DB_USER=${ORDER_DB_USERNAME}
      - DB_PASSWORD=${ORDER_DB_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST}:${DB_PORT}/${ORDER_DB_NAME}?createDatabaseIfNotExist=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${ORDER_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${ORDER_DB_PASSWORD}
    networks:
      - quickbite-net
    restart: unless-stopped

  quickbite-notification:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: quickbite-notification-service:latest
    container_name: quickbite-notification
    ports:
      - "${NOTIFICATION_SERVER_PORT}:${NOTIFICATION_SERVER_PORT}"
    environment:
      - SERVER_PORT=${NOTIFICATION_SERVER_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${NOTIFICATION_DB_NAME}
      - DB_USER=${NOTIFICATION_DB_USERNAME}
      - DB_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST}:${DB_PORT}/${NOTIFICATION_DB_NAME}?createDatabaseIfNotExist=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${NOTIFICATION_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${NOTIFICATION_DB_PASSWORD}
    networks:
      - quickbite-net
    restart: unless-stopped

networks:
  quickbite-net:
    external: true
